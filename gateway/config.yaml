model_list:
- model_name: aqueduct-chat
  litellm_params:
    model: openai/aqueduct-chat
    api_base: http://host.docker.internal:8001/v1
    api_key: os.environ/VLLM_API_KEY
    input_cost_per_token: 0.001
    output_cost_per_token: 0.003
  model_info:
    aqueduct_host: localhost
- model_name: aqueduct-embed
  litellm_params:
    model: openai/aqueduct-embed
    api_base: http://host.docker.internal:8003/v1
    api_key: os.environ/VLLM_API_KEY
    input_cost_per_token: 5.0e-05
    output_cost_per_token: 5.0e-05
  model_info:
    aqueduct_host: localhost
- model_name: aqueduct-fast
  litellm_params:
    model: openai/aqueduct-fast
    api_base: http://host.docker.internal:8002/v1
    api_key: os.environ/VLLM_API_KEY
    input_cost_per_token: 0.0001
    output_cost_per_token: 0.0003
  model_info:
    aqueduct_host: localhost
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  background_health_checks: true
  health_check_interval: 60
litellm_settings:
  drop_params: true
  request_timeout: 900
  num_retries: 2
  turn_off_message_logging: true
  callbacks:
  - prometheus
router_settings:
  routing_strategy: least-busy
  allowed_fails: 3
  cooldown_time: 30
