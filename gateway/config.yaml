# LiteLLM Proxy configuration for Aqueduct.
#
# Logical model names (aqueduct-*) are what callers use. The mapping to real
# backends lives here and here only, so swapping models never touches caller code.
#
# The `openai/` prefix tells LiteLLM to speak the OpenAI protocol to the backend;
# vLLM's server implements it. The model id after the slash must match the
# --served-model-name passed to vLLM (see inference/vllm/models/*.env).

model_list:
  # ---- primary general-purpose model -------------------------------------
  - model_name: aqueduct-chat
    litellm_params:
      model: openai/aqueduct-chat
      api_base: os.environ/VLLM_PRIMARY_URL
      api_key: os.environ/VLLM_API_KEY
      rpm: 600
    model_info:
      mode: chat
      supports_function_calling: true
      # Keep in sync with --max-model-len on the vLLM side.
      max_input_tokens: 65536
      max_output_tokens: 16384

  # ---- second replica of the same model, enabled when machine #2 arrives --
  # Same model_name means LiteLLM load-balances across both entries.
  # - model_name: aqueduct-chat
  #   litellm_params:
  #     model: openai/aqueduct-chat
  #     api_base: os.environ/VLLM_PRIMARY_URL_2
  #     api_key: os.environ/VLLM_API_KEY
  #     rpm: 600

  # ---- small/cheap model for high-frequency simple tasks -----------------
  # - model_name: aqueduct-fast
  #   litellm_params:
  #     model: openai/aqueduct-fast
  #     api_base: os.environ/VLLM_FAST_URL
  #     api_key: os.environ/VLLM_API_KEY

  # ---- embeddings ---------------------------------------------------------
  # - model_name: aqueduct-embed
  #   litellm_params:
  #     model: openai/aqueduct-embed
  #     api_base: os.environ/VLLM_EMBED_URL
  #     api_key: os.environ/VLLM_API_KEY
  #   model_info:
  #     mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Virtual keys are minted through the admin API / UI, never hardcoded here.
  # Health-check backends so a dead vLLM instance is taken out of rotation.
  background_health_checks: true
  health_check_interval: 60

litellm_settings:
  # vLLM rejects unknown sampling params; drop them instead of 400-ing callers
  # whose SDK sends OpenAI-only fields.
  drop_params: true
  # Long generations on H20 can legitimately run for minutes.
  request_timeout: 900
  num_retries: 2
  # Only log metadata and token counts. Request/response bodies stay out of the
  # database — see the security section of docs/design/hld.md.
  turn_off_message_logging: true
  # NOTE: the prometheus callback is an enterprise feature in some LiteLLM
  # releases. If metrics do not show up, fall back to vLLM's own /metrics
  # endpoint plus usage queries against PostgreSQL. Verify on first deploy.
  callbacks: ["prometheus"]

router_settings:
  # With one backend this is a no-op; it starts mattering at two replicas.
  routing_strategy: least-busy
  allowed_fails: 3
  cooldown_time: 30
